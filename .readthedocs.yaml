# Read the Docs builds docs/ with Sphinx on every push, from the locked `docs` dependency group.
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  jobs:
    pre_create_environment:
      - asdf plugin add uv
      - asdf install uv latest
      - asdf global uv latest
    create_environment:
      - uv venv "${READTHEDOCS_VIRTUALENV_PATH}"
    install:
      - UV_PROJECT_ENVIRONMENT="${READTHEDOCS_VIRTUALENV_PATH}" uv sync --locked --no-default-groups --group docs

sphinx:
  configuration: docs/conf.py
  # A broken reference fails the build, as it fails `make docs`.
  fail_on_warning: true
